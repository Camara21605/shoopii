# ============================================================
# FICHIER : .github/workflows/qa-pipeline.yml
#
# RÔLE
# ─────────────────────────────────────────────────────────────
# Pipeline de Quality Assurance automatisé pour Shopi Backend.
# Bloque tout déploiement si une étape critique échoue.
#
# DÉCLENCHEURS
# ─────────────────────────────────────────────────────────────
#   - push sur main / develop
#   - pull request vers main
#   - déclenchement manuel (workflow_dispatch)
#
# ÉTAPES (8)
# ─────────────────────────────────────────────────────────────
#   1. checkout          — récupère le code source
#   2. setup-node        — Node 20 + cache npm
#   3. install           — npm ci (reproducible)
#   4. lint              — ESLint, zéro erreur (les avertissements ne bloquent pas)
#   5. type-check        — tsc --noEmit
#   6. unit-tests        — jest --project unit --coverage
#   7. integration-tests — jest --project integration
#   8. security-tests    — jest --project security
#   9. coverage-gate     — seuils de couverture vérifiés par Jest (jest.config.ts)
#  10. build             — nest build (compile TypeScript)
#  11. audit             — npm audit --audit-level=high
#
# SECRETS REQUIS (à configurer dans GitHub → Settings → Secrets)
# ─────────────────────────────────────────────────────────────
#   JWT_SECRET          — clé JWT de test (≠ production)
#   JWT_REFRESH_SECRET  — clé refresh token de test
#
# AUTEUR       : Shopi03
# DERNIERE MISE A JOUR : 2026-07-18
# ============================================================

name: QA Pipeline — Shopi Backend

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'shopi-backend/**'
      - '.github/workflows/qa-pipeline.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'shopi-backend/**'
  workflow_dispatch:
    inputs:
      skip_security:
        description: 'Ignorer les tests de sécurité (debug uniquement)'
        required: false
        default: 'false'

# ────────────────────────────────────────────────────────────
# VARIABLES GLOBALES
# ────────────────────────────────────────────────────────────
env:
  NODE_VERSION: '20'
  WORKING_DIR: 'shopi-backend'
  NODE_ENV: 'test'

# ────────────────────────────────────────────────────────────
# JOBS
# ────────────────────────────────────────────────────────────
jobs:

  # ══════════════════════════════════════════════════════════
  # JOB 1 — LINT + TYPE CHECK
  # ════════════════════════════════════════════════��═════════
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `shell: bash` active pipefail : sans lui, `| tee` masquait le code
      # retour d'ESLint et l'étape passait toujours, même avec des erreurs.
      # Pas de --fix en CI : on vérifie le code tel qu'il est poussé.
      - name: ESLint
        shell: bash
        run: npm run lint:ci 2>&1 | tee lint-output.txt

      - name: TypeScript — vérification types (noEmit)
        run: npx tsc --noEmit

      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-output
          path: ${{ env.WORKING_DIR }}/lint-output.txt
          retention-days: 7

  # ══════════════════════════════════════════════════════════
  # JOB 2 — TESTS UNITAIRES + COUVERTURE
  # ══════════════════════════════════════════════════════════
  unit-tests:
    name: Tests Unitaires + Couverture
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'shopi-test-jwt-secret-32chars-min' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'shopi-test-refresh-secret-32chars' }}
      REDIS_HOST: 'localhost'
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Les seuils de couverture (coverageThreshold dans jest.config.ts,
      # stratégie "cliquet") sont vérifiés par Jest lui-même : cette étape
      # échoue si l'un d'eux n'est pas atteint.
      - name: Run unit tests with coverage (+ seuils)
        run: npx jest --selectProjects unit --coverage --coverageReporters=text --coverageReporters=json-summary --ci
        env:
          CI: 'true'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ env.WORKING_DIR }}/coverage/
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # JOB 3 — TESTS D'INTÉGRATION
  # ══════════════════════════════════════════════════════════
  integration-tests:
    name: Tests d'Intégration
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'shopi-test-jwt-secret-32chars-min' }}
      REDIS_HOST: 'localhost'
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npx jest --selectProjects integration --ci --forceExit
        env:
          CI: 'true'

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: ${{ env.WORKING_DIR }}/reports/
          retention-days: 14

  # ══════════════════════════════════════════════════════════
  # JOB 4 — TESTS DE SÉCURITÉ
  # ══════════════════════════════════════════════════════════
  security-tests:
    name: Tests de Sécurité (RBAC + Injections)
    runs-on: ubuntu-latest
    needs: unit-tests
    if: ${{ github.event.inputs.skip_security != 'true' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'shopi-test-jwt-secret-32chars-min' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run security tests
        run: npx jest --selectProjects security --ci --forceExit
        env:
          CI: 'true'

  # ══════════════════════════════════════════════════════════
  # JOB 5 — BUILD DE PRODUCTION
  # ══════════════════════════════════════════════════════════
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest
    needs:
      - integration-tests
      - security-tests
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ${{ env.WORKING_DIR }}/dist/
          retention-days: 7

  # ══════════════════════════════════════════════════════════
  # JOB 6 — AUDIT DÉPENDANCES NPM
  # ══════════════════════════════════════════════════════════
  npm-audit:
    name: Audit Dépendances NPM
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    outputs:
      audit_outcome: ${{ steps.audit.outcome }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Non bloquant tant que les vulnérabilités HIGH existantes ne sont pas corrigées ;
      # le résultat réel est remonté dans le résumé QA (job qa-summary).
      - name: Audit dépendances (niveau HIGH)
        id: audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Rapport audit
        run: npm audit --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: ${{ env.WORKING_DIR }}/audit-report.json
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # JOB 7 — RAPPORT FINAL QA (notification)
  # ══════════════════════════════════════════════���═══════════
  qa-summary:
    name: Résumé QA
    runs-on: ubuntu-latest
    needs:
      - lint-and-typecheck
      - unit-tests
      - integration-tests
      - security-tests
      - build
      - npm-audit
    if: always()

    steps:
      # Affiche le résultat RÉEL de chaque job (et non des ✅ codés en dur),
      # puis échoue si un job critique n'a pas réussi.
      - name: Résumé du pipeline
        env:
          R_LINT: ${{ needs.lint-and-typecheck.result }}
          R_UNIT: ${{ needs.unit-tests.result }}
          R_INTEG: ${{ needs.integration-tests.result }}
          R_SECU: ${{ needs.security-tests.result }}
          R_BUILD: ${{ needs.build.result }}
          R_AUDIT_JOB: ${{ needs.npm-audit.result }}
          R_AUDIT: ${{ needs.npm-audit.outputs.audit_outcome }}
        run: |
          icon() {
            case "$1" in
              success) echo "✅" ;;
              skipped) echo "⏭️ " ;;
              *)       echo "❌" ;;
            esac
          }
          echo "======================================="
          echo "  Shopi QA Pipeline — Résumé Final"
          echo "======================================="
          echo "  Branch    : ${{ github.ref_name }}"
          echo "  Commit    : ${{ github.sha }}"
          echo "  Triggered : ${{ github.event_name }}"
          echo "  Datetime  : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "======================================="
          echo ""
          echo "  Jobs exécutés :"
          echo "  $(icon "$R_LINT") Lint + TypeCheck ($R_LINT)"
          echo "  $(icon "$R_UNIT") Tests unitaires + Coverage gate ($R_UNIT)"
          echo "  $(icon "$R_INTEG") Tests d'intégration ($R_INTEG)"
          echo "  $(icon "$R_SECU") Tests de sécurité RBAC + Injections ($R_SECU)"
          echo "  $(icon "$R_BUILD") Build TypeScript ($R_BUILD)"
          if [ "$R_AUDIT" = "success" ]; then
            echo "  ✅ Audit dépendances npm (aucune vulnérabilité HIGH)"
          else
            echo "  ⚠️  Audit dépendances npm : vulnérabilités HIGH détectées ou audit en échec ($R_AUDIT_JOB / ${R_AUDIT:-n/a}) — non bloquant"
            echo "::warning title=npm audit::Vulnérabilités HIGH détectées dans shopi-backend (voir l'artefact npm-audit-report)"
          fi
          echo ""

          failed=0
          for r in "$R_LINT" "$R_UNIT" "$R_INTEG" "$R_BUILD" "$R_AUDIT_JOB"; do
            [ "$r" = "success" ] || failed=1
          done
          # Les tests de sécurité peuvent être volontairement ignorés (skip_security).
          case "$R_SECU" in success|skipped) ;; *) failed=1 ;; esac

          if [ "$failed" -ne 0 ]; then
            echo "  ❌ Déploiement BLOQUÉ : au moins un job critique a échoué."
            exit 1
          fi
          echo "  ✅ Le déploiement est AUTORISÉ : tous les jobs critiques sont verts."
