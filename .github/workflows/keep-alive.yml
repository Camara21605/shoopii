# ============================================================
# FICHIER : .github/workflows/keep-alive.yml
#
# RÔLE
# ─────────────────────────────────────────────────────────────
# Empêche le backend Render (plan free) de se mettre en veille
# après 15 min d'inactivité — sans ce ping, la 1re requête d'un
# visiteur après une période creuse (login, register, etc.)
# attend le "réveil" du serveur (30-90s) et peut expirer côté
# client (timeout).
#
# DÉCLENCHEURS
# ─────────────────────────────────────────────────────────────
#   - toutes les 10 minutes (cron) — sous les 15 min de veille
#   - déclenchement manuel (workflow_dispatch), pour tester
#
# NOTE : GitHub peut retarder légèrement un cron programmé lors
#   de pics de charge sur ses runners — ce n'est pas garanti à
#   la minute près, mais largement suffisant pour cet usage.
#
# URL — BUG CORRIGÉ : le nom de service dans render.yaml
#   ("shopi-backend") ne correspond pas forcément à l'hôte
#   .onrender.com réel. Vérifié en direct : "shoopii.onrender.com"
#   ne répondait jamais (100s de timeout, aucun service réel
#   derrière), alors que "shopi-backend.onrender.com" répond
#   immédiatement (< 1s) — c'est le bon hôte.
#
# STATUT HTTP — volontairement pas de -f (fail-on-error) : le but
#   est de réveiller/maintenir le process Node, pas de valider une
#   route précise. Un 404/401 prouve tout autant que le serveur est
#   éveillé et répond qu'un 200 ; seule une vraie panne réseau
#   (timeout, connexion refusée) doit être signalée comme un échec.
# ============================================================

name: Keep backend alive (Render free tier)

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping le backend (n'importe quelle réponse HTTP = serveur éveillé)
        run: |
          curl -sS --max-time 60 -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" \
            https://shopi-backend.onrender.com/api/health || \
          echo "⚠️ Ping échoué (panne réseau) — le backend était peut-être déjà en train de se réveiller."
