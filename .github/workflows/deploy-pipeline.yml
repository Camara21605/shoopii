# ============================================================
# FICHIER : .github/workflows/deploy-pipeline.yml
#
# RÔLE
# ─────────────────────────────────────────────────────────────
# Pipeline de déploiement complet pour Shopi Backend.
# Étend qa-pipeline.yml avec les étapes de déploiement
# sur les environnements staging et production.
#
# DÉCLENCHEURS
# ─────────────────────────────────────────────────────────────
#   - push sur 'develop'  → déploiement automatique en staging
#   - push sur 'main'     → déploiement automatique en production
#   - tag v*.*.*          → déploiement production (release)
#   - workflow_dispatch   → déploiement manuel avec env cible
#
# JOBS
# ─────────────────────────────────────────────────────────────
#   1. quality-gate      — Tests complets + coverage (réutilise qa-pipeline)
#   2. build             — Build TypeScript + image
#   3. deploy-staging    — Déploiement automatique staging (develop uniquement)
#   4. smoke-test        — Tests de fumée post-déploiement staging
#   5. deploy-production — Déploiement production (main/tag uniquement)
#   6. health-check      — Vérification santé post-déploiement
#   7. notify            — Notification Slack/email du résultat
#
# SECRETS REQUIS (GitHub → Settings → Secrets)
# ─────────────────────────────────────────────────────────────
#   JWT_SECRET                  — Test JWT secret
#   JWT_REFRESH_SECRET          — Test refresh secret
#   RENDER_API_KEY              — Clé API Render (Deploy Hook)
#   RENDER_SERVICE_ID_STAGING   — ID du service staging Render
#   RENDER_SERVICE_ID_PROD      — ID du service production Render
#   SLACK_WEBHOOK_URL           — Webhook Slack (optionnel)
#
# AUTEUR       : Shopi03
# DERNIERE MISE A JOUR : 2026-07-18
# ============================================================

name: Deploy Pipeline — Shopi

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'shopi-backend/**'
      - '.github/workflows/deploy-pipeline.yml'
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environnement cible'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Ignorer les tests (urgence uniquement)'
        required: false
        default: 'false'

env:
  NODE_VERSION: '20'
  WORKING_DIR: 'shopi-backend'
  NODE_ENV: 'test'

# ────────────────────────────────────────────────────────────
# JOBS
# ────────────────────────────────────────────────────────────
jobs:

  # ══════════════════════════════════════════════════════════
  # JOB 1 — QUALITY GATE (tests + couverture)
  # ══════════════════════════════════════════════════════════
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    env:
      JWT_SECRET: ${{ secrets.JWT_SECRET || 'shopi-test-jwt-secret-32chars-min' }}
      JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET || 'shopi-test-refresh-32chars' }}
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeCheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Tests unitaires + Coverage Gate
        run: |
          npx jest --selectProjects unit --coverage --coverageReporters=text --coverageReporters=json-summary --ci
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            const checks = [
              ['branches', s.branches.pct, 60],
              ['functions', s.functions.pct, 70],
              ['lines', s.lines.pct, 70],
              ['statements', s.statements.pct, 70],
            ];
            let fail = false;
            checks.forEach(([n,a,t]) => {
              const ok = a >= t;
              console.log((ok ? '✅' : '❌') + ' ' + n + ': ' + a.toFixed(1) + '% (min: ' + t + '%)');
              if (!ok) fail = true;
            });
            if (fail) { console.error('❌ Coverage gate failed'); process.exit(1); }
          "
        env:
          CI: 'true'

      - name: Tests d'intégration
        run: npx jest --selectProjects integration --ci --forceExit
        env:
          CI: 'true'

      - name: Tests de sécurité
        run: npx jest --selectProjects security --ci --forceExit
        env:
          CI: 'true'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/coverage/
          retention-days: 30

  # ══════════════════════════════════════════════════════════
  # JOB 2 — BUILD
  # ══════════════════════════════════════════════════════════
  build:
    name: Build TypeScript
    runs-on: ubuntu-latest
    needs: quality-gate
    if: always() && (needs.quality-gate.result == 'success' || github.event.inputs.skip_tests == 'true')
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: Install dependencies (production)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Vérifier le build
        run: |
          test -f dist/main.js || (echo "❌ dist/main.js manquant" && exit 1)
          echo "✅ Build OK — $(du -sh dist/ | cut -f1)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: ${{ env.WORKING_DIR }}/dist/
          retention-days: 7

  # ══════════════════════════════════════════════════════════
  # JOB 3 — DÉPLOIEMENT STAGING
  # ══════════════════════════════════════════════════════════
  deploy-staging:
    name: Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/develop' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment:
      name: staging
      url: https://shopi-backend-staging.onrender.com

    steps:
      - name: Trigger Render Deploy (staging)
        run: |
          echo "🚀 Déclenchement déploiement staging..."
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID_STAGING }}?key=${{ secrets.RENDER_API_KEY }}" \
            | grep -q "200\|201" && echo "✅ Déploiement déclenché" || (echo "❌ Échec du déclenchement" && exit 1)

      - name: Attendre le déploiement (2 minutes)
        run: sleep 120

  # ══════════════════════════════════════════════════════════
  # JOB 4 — SMOKE TEST STAGING
  # ══════════════════════════════════════════════════════════
  smoke-test-staging:
    name: Smoke Tests → Staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: needs.deploy-staging.result == 'success'

    steps:
      - name: Health check staging
        run: |
          MAX_RETRIES=5
          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://shopi-backend-staging.onrender.com/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check OK (tentative $i)"
              exit 0
            fi
            echo "⏳ Tentative $i/$MAX_RETRIES — statut: $STATUS"
            sleep 30
          done
          echo "❌ Health check échoué après $MAX_RETRIES tentatives"
          exit 1

      - name: Test endpoint auth (smoke)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://shopi-backend-staging.onrender.com/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"test@invalid.com","password":"invalid"}')
          # 401 ou 400 = API répond correctement
          if [ "$STATUS" = "401" ] || [ "$STATUS" = "400" ]; then
            echo "✅ Auth endpoint répond (HTTP $STATUS)"
          else
            echo "❌ Réponse inattendue: HTTP $STATUS"
            exit 1
          fi

  # ══════════════════════════════════════════════════════════
  # JOB 5 — DÉPLOIEMENT PRODUCTION
  # ══════════════════════════════════════════════════════════
  deploy-production:
    name: Deploy → Production
    runs-on: ubuntu-latest
    needs: build
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://shopi-backend.onrender.com

    steps:
      - name: Confirmation déploiement production
        run: |
          echo "================================================"
          echo "  🚨 DÉPLOIEMENT EN PRODUCTION"
          echo "  Branch/Tag : ${{ github.ref }}"
          echo "  Commit     : ${{ github.sha }}"
          echo "  Auteur     : ${{ github.actor }}"
          echo "  Date       : $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "================================================"

      - name: Trigger Render Deploy (production)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            "https://api.render.com/deploy/${{ secrets.RENDER_SERVICE_ID_PROD }}?key=${{ secrets.RENDER_API_KEY }}" \
            | grep -q "200\|201" && echo "✅ Déploiement production déclenché" || (echo "❌ Échec" && exit 1)

      - name: Attendre le déploiement (3 minutes)
        run: sleep 180

  # ══════════════════════════════════════════════════════════
  # JOB 6 — HEALTH CHECK PRODUCTION
  # ══════════════════════════════════════════════════════════
  health-check-production:
    name: Health Check → Production
    runs-on: ubuntu-latest
    needs: deploy-production
    if: needs.deploy-production.result == 'success'

    steps:
      - name: Health check production
        run: |
          MAX_RETRIES=6
          for i in $(seq 1 $MAX_RETRIES); do
            RESPONSE=$(curl -s https://shopi-backend.onrender.com/health)
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://shopi-backend.onrender.com/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production opérationnelle"
              echo "Réponse: $RESPONSE"
              exit 0
            fi
            echo "⏳ Tentative $i/$MAX_RETRIES — HTTP $STATUS"
            sleep 30
          done
          echo "❌ ALERTE: Production ne répond pas correctement"
          echo "⚠️  Déclencher le rollback manuellement"
          exit 1

  # ══════════════════════════════════════════════════════════
  # JOB 7 — NOTIFICATION
  # ══════════════════════════════════════════════════════════
  notify:
    name: Notification déploiement
    runs-on: ubuntu-latest
    needs:
      - health-check-production
    if: always()

    steps:
      - name: Résumé du déploiement
        run: |
          echo "======================================="
          echo "  Shopi Deploy — Résumé"
          echo "======================================="
          echo "  Branch  : ${{ github.ref_name }}"
          echo "  Commit  : ${{ github.sha }}"
          echo "  Acteur  : ${{ github.actor }}"
          echo "  Datetime: $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo "  Résultat: ${{ needs.health-check-production.result }}"
          echo "======================================="

      - name: Notification Slack (si configuré)
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          ICON=$([[ "${{ needs.health-check-production.result }}" == "success" ]] && echo "✅" || echo "❌")
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"text\": \"$ICON Shopi Deploy — ${{ github.ref_name }} @ $(date -u '+%H:%M UTC')\",
              \"blocks\": [{
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"$ICON *Shopi Backend* déployé en production\\n>Branch: \`${{ github.ref_name }}\`\\n>Commit: \`${{ github.sha }}\`\\n>Statut: ${{ needs.health-check-production.result }}\"
                }
              }]
            }"
