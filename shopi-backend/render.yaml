# ============================================================
# FICHIER : render.yaml
# RÔLE    : Configuration Infrastructure-as-Code pour Render.
#           Placez ce fichier à la racine du dépôt.
#           Render le détecte automatiquement.
# Docs    : https://render.com/docs/infrastructure-as-code
# ============================================================

services:

  # ── Backend NestJS ───────────────────────────────────────────
  - type: web
    name: shopi-backend
    runtime: node
    region: frankfurt           # Europe (le plus proche de la Guinée)
    plan: free                  # free | starter | standard
    rootDir: shopi-backend      # dossier du backend dans le dépôt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/auth/me   # 401 = OK (endpoint protégé)

    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false             # À remplir manuellement dans Render Dashboard
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true     # Render génère une valeur aléatoire sécurisée
      - key: JWT_EXPIRES_IN
        value: "24h"
      # BUG CORRIGÉ : "REDIS_URL" (une seule chaîne de connexion) n'est
      # lu par AUCUN module du code — app.module.ts (RedisModule +
      # BullModule) attend HOST/PORT/PASSWORD/TLS séparément. Avec l'ancien
      # "REDIS_URL", REDIS_HOST restait vide → soit crash immédiat
      # ("[Redis/ioredis] REDIS_HOST manquant"), soit — si REDIS_HOST avait
      # été rajouté à la main dans le Dashboard Render avec une valeur
      # obsolète/erronée — connexion refusée en boucle
      # ([ioredis] ECONNREFUSED, "Toujours indisponible après 30 tentatives").
      # Pour Upstash Redis (format attendu par le code) :
      #   REDIS_HOST=xxxxx.upstash.io   REDIS_PORT=6379
      #   REDIS_PASSWORD=xxxxx          REDIS_TLS=true
      - key: REDIS_HOST
        sync: false             # ex: xxxxx.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_TLS
        value: "true"            # Upstash/Redis Cloud imposent TLS sur ce port
      - key: FRONTEND_URL
        sync: false             # URL de votre frontend déployé
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_FIRSTNAME
        value: Super
      - key: SUPER_ADMIN_LASTNAME
        value: Admin
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
      - key: METERED_TURN_HOST
        sync: false             # Host TURN Metered.ca (ex: global.relay.metered.ca) — appels audio/vidéo
      - key: METERED_TURN_USERNAME
        sync: false             # Username TURN statique généré dans le dashboard Metered.ca
      - key: METERED_TURN_CREDENTIAL
        sync: false             # Credential TURN statique — reste côté serveur, jamais exposé au frontend
