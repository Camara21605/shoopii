<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoneya — Marketplace Africaine</title>
    <meta name="description" content="Shoneya — la marketplace africaine : boutiques, produits et services près de chez vous." />
    <!-- Aperçu de lien par défaut (WhatsApp, Facebook, X…). Les pages
         /boutique, /produit et /service reçoivent un aperçu dédié via
         api/og.js (voir vercel.json). -->
    <meta property="og:site_name" content="Shoneya" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Shoneya — Marketplace Africaine" />
    <meta property="og:description" content="Boutiques, produits et services près de chez vous." />
    <meta name="twitter:card" content="summary" />

    <!-- ✅ Applique le thème AVANT le premier rendu (évite le flash blanc/bleu
         puis noir : sans ce script, [data-theme="dark"] n'est posé sur <html>
         que dans un useEffect de ThemeProvider, donc après la 1ère peinture). -->
    <script>
      (function () {
        var root = document.documentElement;
        var p = location.pathname;
        /* Thème — même logique que ThemeContext.tsx :
         *   préférence 'light' | 'dark' | 'system' (localStorage shopi_theme),
         *   sauf sur les pages encore forcées en sombre (useForceDarkTheme :
         *   router.tsx DARK_FORCED_PREFIXES + Centre d'aide / support). */
        var forced = /^\/(dashboard\/(super-admin|partenaire|correspondant)|aide|support|remboursements|politique-retour|contact|messagerie)(\/|$)/.test(p) || /^\/commande\/[^/]+\/suivi/.test(p);
        var theme = 'dark';
        try {
          var pref = localStorage.getItem('shopi_theme');
          if (pref === 'light') theme = 'light';
          else if (pref === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) theme = 'light';
        } catch (e) { /* navigation privée : sombre */ }
        if (forced) theme = 'dark';
        root.setAttribute('data-theme', theme);
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'light' ? '#FFFFFF' : '#000000');
        /* Police "style X" (voir tokens.css :root[data-site="home"]) posée
         * AVANT le premier rendu — sans ça la police serif d'origine
         * clignoterait un instant sur les pages publiques. Tenu à jour
         * ensuite à chaque navigation par SiteScopeSync (router.tsx). */
        var scoped = /^\/(dashboard|login|register|rejoindre)(\/|$)/.test(p);
        root.setAttribute('data-site', scoped ? 'app' : 'home');
        if (/^\/dashboard\/entreprise(\/|$)/.test(p)) root.setAttribute('data-area', 'entreprise');
      })();
    </script>

    <!-- ✅ Écran de démarrage — styles partagés avec LoadingScreen.tsx.
         BUG CORRIGÉ « le logo s'affiche deux fois au premier chargement » :
         avant, la page restait NOIRE et vide le temps de télécharger le
         JavaScript (~1,5 s en 4G), puis LoadingScreen apparaissait en fondu
         avec son propre fond bleu — après l'écran de lancement Android/PWA
         qui montre déjà le logo, on voyait donc le logo, un trou noir, puis
         le logo une 2e fois (et une 3e/4e fois pour un compte pro : Home
         affichée un instant, nouvel écran de chargement, puis petit logo
         dans le dashboard). Désormais un SEUL écran : affiché par le HTML
         dès la première peinture, repris à l'identique par LoadingScreen
         (même classes, même image, pulsation synchronisée, sans fondu).
         Le logo est INTÉGRÉ dans la page (WebP 256 px, 2 Ko — l'ancien PNG
         faisait 1080 px / 42 Ko pour un affichage à 128 px) : visible dès
         la toute première image, sans attendre aucun téléchargement. -->
    <style>
      .sh-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:#000}
      :root[data-theme="light"] .sh-splash{background:#fff}
      .sh-splash__logo{display:block;width:128px;height:128px;border-radius:23px;animation:sh-pulse 2.2s ease-in-out infinite}
      .sh-splash__dots{display:flex;gap:7px}
      .sh-splash__dots span{width:8px;height:8px;border-radius:50%;background:#2196F3;animation:sh-dot 1.1s ease-in-out infinite}
      .sh-splash__dots span:nth-child(2){animation-delay:.18s}
      .sh-splash__dots span:nth-child(3){animation-delay:.36s}
      @keyframes sh-pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.06);opacity:.88}}
      @keyframes sh-dot{0%,80%,100%{transform:scaleY(1);opacity:.4}40%{transform:scaleY(1.6);opacity:1}}
      @media (prefers-reduced-motion:reduce){.sh-splash__logo,.sh-splash__dots span{animation:none}}
    </style>

    <!-- ✅ Font Awesome 6.5 — Toutes les icônes fas fa-*
         preconnect : sans ça, cette feuille de style attend une résolution
         DNS + handshake TLS complets vers cdnjs avant même de commencer à
         télécharger (contrairement à Google Fonts ci-dessous, qui en
         bénéficiait déjà).

         Chargement NON bloquant (media="print" puis bascule sur "all" au
         onload) : un <link rel="stylesheet"> classique bloque le premier
         rendu de TOUTE la page tant que le CDN n'a pas répondu — si
         cdnjs.cloudflare.com est lent/indisponible, ça retarde l'apparition
         de la page entière (Header, Home, tout) juste pour des icônes, qui
         ne sont de toute façon qu'un détail visuel secondaire à côté du
         texte/contenu réel. Avec ce pattern, la page s'affiche immédiatement
         avec des icônes manquantes le temps que la feuille de style arrive,
         plutôt que d'attendre — <noscript> garde le comportement classique
         si JS est désactivé. -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin />
    <link
      rel="preload" as="style"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet" />
    </noscript>

    <!-- ✅ Google Fonts — Fraunces (titres) + DM Sans (texte)
         Même pattern non bloquant que ci-dessus. `display=swap` (déjà dans
         l'URL) garantit que le texte reste lisible avec la police de repli
         pendant le chargement, mais la feuille elle-même reste bloquante
         par défaut sans ce pattern — même raisonnement que Font Awesome :
         le texte du site ne doit jamais attendre un CDN tiers pour
         s'afficher. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,300&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    </noscript>
  </head>
